parameters:
  -
    in: path
    name: id
    required: true
    description: 'The snippet id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Snippet
  summary: 'Edit a snippet form.'
  operationId: edit_snippet
  responses:
    200:
      description: 'The edit information.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/snippet.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
